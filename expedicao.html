<style>
:root{
  --bg:#f5f0e8; --bg2:#ede8de; --card:#ffffff; --card2:#3d3d3d; --card3:#f9f6f0;
  --yellow:#b8862a; --yellow2:#9a6e1a;
  --text:#1a1a1a; --text2:#5a5a5a; --text3:#9a9a9a;
  --green:#2db87a; --green-bg:#e8f8f0; --red:#e84545; --red-bg:#fde8e8;
  --blue:#4a7fff; --border:#e8e0d0;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:18px; --r-sm:12px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}

/* ── TOPBAR ─────────────────────────────────────────── */
.top{
  flex-shrink:0;background:#4a4a4a;color:#fff;
  padding:calc(var(--safe-t) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;
}
.top-logo{width:30px;height:30px;border-radius:8px;flex-shrink:0}
.top-t{flex:1;min-width:0}
.top-t h1{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.top-t p{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.top-back{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sync-dot{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
  padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);flex-shrink:0}
.sync-dot b{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.sync-dot.off b{background:var(--red)}
.sync-dot.pend b{background:var(--yellow)}

/* ── SCREEN ─────────────────────────────────────────── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;display:none}
.screen.on{display:block}

/* ── NAV ────────────────────────────────────────────── */
.nav{
  flex-shrink:0;display:flex;background:var(--card);border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
}
.nav button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text3);font-size:10px;font-weight:600;transition:color .15s}
.nav button span{font-size:19px;line-height:1}
.nav button.on{color:var(--yellow)}

/* ── CARDS / BLOCKS ─────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-dark{background:var(--card2);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.09em;margin-bottom:10px}
.sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.09em;margin:20px 2px 8px}
.sec-title:first-child{margin-top:4px}

/* ── BUTTONS ────────────────────────────────────────── */
.btn{
  width:100%;padding:17px 18px;border-radius:16px;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .08s,filter .15s;letter-spacing:-.01em;
}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.4}
.btn-gold{background:var(--yellow);color:#fff;box-shadow:0 4px 14px rgba(184,134,42,.28)}
.btn-dark{background:var(--card2);color:#fff}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(45,184,122,.28)}
.btn-ghost{background:var(--card);color:var(--text2);border:1px solid var(--border);box-shadow:none}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid #f5c0c0}
.btn-lg{padding:22px 18px;font-size:18px;border-radius:20px}
.btn-sm{padding:11px 14px;font-size:13px;border-radius:12px;width:auto}
.btn-row{display:flex;gap:9px}
.btn-row .btn{width:auto;flex:1}

/* ── FORM ───────────────────────────────────────────── */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;
  background:var(--card);font-size:15px;outline:none;transition:border-color .15s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--yellow)}
.fld .hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.45}
.fld input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--border)}
.sw:last-child{border-bottom:none}
.sw-t{font-size:14px;font-weight:600}
.sw-s{font-size:11px;color:var(--text3);margin-top:2px}
.tog{width:46px;height:27px;border-radius:20px;background:var(--bg2);position:relative;
  flex-shrink:0;transition:background .2s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tog.on{background:var(--green)}
.tog.on::after{transform:translateX(19px)}

/* ── KPI ────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 11px;text-align:center}
.kpi-v{font-size:21px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.kpi-l{font-size:9.5px;color:var(--text3);font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;margin-top:4px;line-height:1.25}

/* ── ACTIVE SEPARATION HERO ─────────────────────────── */
.hero{background:var(--card2);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:rgba(184,134,42,.16)}
.hero-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.45);margin-bottom:5px}
.hero-pv{font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1.05;
  word-break:break-all;position:relative}
.hero-timer{font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;margin:14px 0 3px;position:relative}
.hero-sub{font-size:12px;color:rgba(255,255,255,.5);position:relative}
.hero-chips{display:flex;gap:7px;margin-top:14px;position:relative;flex-wrap:wrap}
.hchip{background:rgba(255,255,255,.11);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600}

/* ── ITEM LIST ──────────────────────────────────────── */
.item{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 13px;margin-bottom:8px;
  animation:pop .25s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.item-n{width:29px;height:29px;border-radius:9px;background:var(--bg2);color:var(--text2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.item-b{flex:1;min-width:0}
.item-code{font-size:15px;font-weight:700;letter-spacing:-.01em;word-break:break-all;line-height:1.25}
.item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.item-x{width:31px;height:31px;border-radius:9px;background:var(--bg2);color:var(--text3);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

/* ── ROW (history) ──────────────────────────────────── */
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:13px;margin-bottom:8px;width:100%;text-align:left}
.row:active{background:var(--card3)}
.row-b{flex:1;min-width:0}
.row-t{font-size:15px;font-weight:700;letter-spacing:-.015em;word-break:break-all}
.row-s{font-size:11.5px;color:var(--text3);margin-top:3px}
.row-r{text-align:right;flex-shrink:0}
.row-v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row-vs{font-size:10px;color:var(--text3);margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;letter-spacing:.02em}
.tag-g{background:var(--green-bg);color:var(--green)}
.tag-r{background:var(--red-bg);color:var(--red)}
.tag-y{background:#fff8e0;color:var(--yellow2)}
.tag-n{background:var(--bg2);color:var(--text3)}

.empty{text-align:center;padding:44px 22px;color:var(--text3)}
.empty-i{font-size:42px;margin-bottom:10px;opacity:.35}
.empty-t{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:4px}
.empty-s{font-size:12.5px;line-height:1.5}

.dl{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.dl:last-child{border-bottom:none}
.dl-k{color:var(--text3);flex-shrink:0}
.dl-v{font-weight:700;text-align:right;word-break:break-all}

/* ── SCANNER ────────────────────────────────────────── */

<input id="wedge" style="position:fixed;opacity:0;pointer-events:none;top:-100px;left:0;width:1px;height:1px" autocomplete="off">

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CACTO — APP DE EXPEDIÇÃO E SEPARAÇÃO
   Fluxo: lê QR do PV → cronômetro inicia → lê etiqueta de cada item
          (nº de rastreabilidade = pedido de compra) → Finalizar →
          registra duração da separação e data/hora de liberação p/ produção.
   Offline-first: tudo grava em localStorage e sincroniza com o Google Sheets
   quando houver rede.
   ══════════════════════════════════════════════════════════════════════════ */

const STORE_KEY = 'cacto_exp_v1';
const APPS_SCRIPT_URL_PADRAO = "https://script.google.com/macros/s/AKfycbyd4ipXMR0phDH0T1n2PTEU_5L9BNgOp_f5e6Y1jYaUKeWJ-XpcQlHqKUZjxPlk12wdcg/exec";

const CFG_PADRAO = {
  operador: '',
  appsScriptUrl: APPS_SCRIPT_URL_PADRAO,
  abaSeparacao: 'Separacao',
  abaItens: 'Separacao_Itens',
  regexPV: '',
  regexItem: '',
  bip: true,
  vibrar: true,
  bloquearDuplicado: true,
  scanContinuo: true
};

let S = {
  cfg: { ...CFG_PADRAO },
  ativa: null,        // separação em andamento
  historico: [],      // separações finalizadas / canceladas
  tela: 'home',
  detId: null,
  histFiltro: 'hoje'
};

/* ── PERSISTÊNCIA ─────────────────────────────────────────────────────── */
function carregar(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    S.cfg = { ...CFG_PADRAO, ...(d.cfg||{}) };
    S.ativa = d.ativa || null;
    S.historico = Array.isArray(d.historico) ? d.historico : [];
  }catch(e){ console.warn('Falha ao ler storage', e); }
}
function salvar(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      cfg: S.cfg, ativa: S.ativa, historico: S.historico, v: 1
    }));
  }catch(e){ toast('Sem espaço para salvar localmente', 'err'); }
}

/* ── UTILS ────────────────────────────────────────────────────────────── */
const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);

function fmtDur(ms){
  if(ms==null || isNaN(ms)) return '—';
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function fmtDurCurto(ms){
  if(ms==null || isNaN(ms)) return '—';
  const s = Math.floor(ms/1000);
  if(s < 60) return s + 's';
  const m = Math.floor(s/60);
  if(m < 60) return m + 'min';
  return Math.floor(m/60) + 'h' + pad(m%60);
}
function fmtHora(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtData(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function fmtDataHora(ts){
  return ts ? fmtData(ts) + ' ' + fmtHora(ts) : '—';
}
function isoLocal(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function ehHoje(ts){
  const a = new Date(ts), b = new Date();
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Evita "PV PV-10233" quando o próprio código já traz o prefixo. */
function rotuloPV(pv){
  const v = String(pv||'').trim();
  return /^pv\b/i.test(v) ? v : 'PV ' + v;
}

function novoId(){
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `SEP-${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
}

/* ── EXTRAÇÃO DE CÓDIGO ───────────────────────────────────────────────────
   O conteúdo do QR/código de barras varia por sistema. A regra abaixo tenta,
   em ordem:
     1. a regex configurada em Config (grupo 1, ou o match inteiro);
     2. se o conteúdo for uma URL, o último segmento ou o valor de um
        parâmetro típico (pv, pedido, id, cod, doc);
     3. se for "CHAVE=VALOR" ou "CHAVE:VALOR", o valor;
     4. o conteúdo bruto, sem espaços nas pontas.                             */
function extrair(bruto, regexStr){
  let v = String(bruto == null ? '' : bruto).trim();
  if(!v) return '';
  if(regexStr){
    try{
      const m = v.match(new RegExp(regexStr));
      if(m) return String(m[1] != null ? m[1] : m[0]).trim();
    }catch(e){ /* regex inválida: cai para heurística */ }
  }
  if(/^https?:\/\//i.test(v)){
    try{
      const u = new URL(v);
      for(const k of ['pv','PV','pedido','numero','num','id','cod','codigo','doc','oc']){
        const q = u.searchParams.get(k);
        if(q) return q.trim();
      }
      const seg = u.pathname.split('/').filter(Boolean).pop();
      if(seg) return decodeURIComponent(seg).trim();
    }catch(e){ /* URL malformada: segue */ }
  }
  const kv = v.match(/^[A-Za-zÀ-ú ._-]{1,24}\s*[:=]\s*(.+)$/);
  if(kv) return kv[1].trim();
  return v;
}

/* ── FEEDBACK ─────────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg, tipo){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (tipo ? ' ' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (tipo ? ' ' + tipo : ''); }, 2600);
}
let audioCtx = null;
function bip(freq, dur){
  if(!S.cfg.bip) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq || 1180;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, audioCtx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur||0.11));
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + (dur||0.11) + 0.02);
  }catch(e){ /* áudio bloqueado até o 1º toque: ignorar */ }
}
function vibrar(p){
  if(S.cfg.vibrar && navigator.vibrate) { try{ navigator.vibrate(p); }catch(e){} }
}
function sucesso(){
  bip(1180, .1); vibrar(60);
  const f = $('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'), 130);
}
function erro(){ bip(320, .22); vibrar([70,60,70]); }

/* ══════════════════════════════════════════════════════════════════════════
   DOMÍNIO — SEPARAÇÃO
   ══════════════════════════════════════════════════════════════════════════ */

function iniciarSeparacao(bruto){
  const pv = extrair(bruto, S.cfg.regexPV);
  if(!pv){ erro(); toast('Código do PV vazio', 'err'); return false; }

  const jaAberta = S.ativa && S.ativa.pv === pv;
  if(jaAberta){ toast('Separação do ' + rotuloPV(pv) + ' já está aberta'); EXP.go('sep'); return true; }

  if(S.ativa && S.ativa.itens.length){
    // Não descarta trabalho já feito sem confirmação explícita.
    confirmar({
      titulo: 'Já existe uma separação aberta',
      texto: `O <b>${esc(rotuloPV(S.ativa.pv))}</b> está em andamento com ${S.ativa.itens.length} ` +
             `item(ns) lido(s). Finalize ou cancele antes de iniciar o ${esc(rotuloPV(pv))}.`,
      ok: 'Ir para a separação aberta',
      okCls: 'btn-dark',
      onOk: () => EXP.go('sep')
    });
    return false;
  }

  const agora = Date.now();
  S.ativa = {
    id: novoId(),
    pv,
    pvBruto: String(bruto).trim(),
    operador: S.cfg.operador || '',
    inicio: agora,
    fim: null,
    itens: [],
    obs: '',
    status: 'em_andamento',
    sync: 'pendente'
  };
  salvar();
  sucesso();
  toast(rotuloPV(pv) + ' — separação iniciada', 'ok');
  EXP.go('sep');
  return true;
}

function addItem(bruto){
  if(!S.ativa){ erro(); toast('Nenhuma separação aberta', 'err'); return false; }
  const cod = extrair(bruto, S.cfg.regexItem);
  if(!cod){ erro(); toast('Código do item vazio', 'err'); return false; }

  if(S.cfg.bloquearDuplicado && S.ativa.itens.some(i => i.rastreabilidade === cod)){
    erro();
    toast('Item ' + cod + ' já foi lido neste PV', 'err');
    return false;
  }

  const agora = Date.now();
  const ant = S.ativa.itens.length ? S.ativa.itens[S.ativa.itens.length-1].ts : S.ativa.inicio;
  S.ativa.itens.push({
    seq: S.ativa.itens.length + 1,
    rastreabilidade: cod,
    bruto: String(bruto).trim(),
    ts: agora,
    desdeInicioMs: agora - S.ativa.inicio,
    desdeAnteriorMs: agora - ant
  });
  salvar();
  sucesso();
  return true;
}

function removerItem(seq){
  if(!S.ativa) return;
  let ant = S.ativa.inicio;
  S.ativa.itens = S.ativa.itens
    .filter(i => i.seq !== seq)
    .map((i, idx) => {
      const novo = { ...i, seq: idx + 1, desdeAnteriorMs: i.ts - ant };
      ant = i.ts;
      return novo;
    });
  salvar();
  renderSep();
  toast('Item removido');
}

function finalizarSeparacao(){
  if(!S.ativa) return;
  const sep = S.ativa;
  sep.fim = Date.now();
  sep.duracaoMs = sep.fim - sep.inicio;
  sep.liberadoEm = sep.fim;          // data/hora em que o PV ficou liberado p/ produção
  sep.status = 'finalizada';
  sep.sync = 'pendente';
  sep.operador = sep.operador || S.cfg.operador || '';
  S.historico.unshift(sep);
  S.ativa = null;
  salvar();
  bip(1180,.09); setTimeout(()=>bip(1560,.14), 110); vibrar([60,50,90]);
  S.detId = sep.id;
  EXP.go('det');
  sincronizar();
}

function cancelarSeparacao(){
  if(!S.ativa) return;
  const sep = S.ativa;
  sep.fim = Date.now();
  sep.duracaoMs = sep.fim - sep.inicio;
  sep.status = 'cancelada';
  sep.sync = 'nao_aplica';
  S.historico.unshift(sep);
  S.ativa = null;
  salvar();
  toast('Separação cancelada');
  EXP.go('home');
}

function acharSep(id){
  return S.historico.find(s => s.id === id) || (S.ativa && S.ativa.id === id ? S.ativa : null);
}

/* ── MÉTRICAS ─────────────────────────────────────────────────────────── */
function finalizadas(){ return S.historico.filter(s => s.status === 'finalizada'); }

function metricas(lista){
  const l = lista.filter(s => s.status === 'finalizada');
  const nPv = l.length;
  const nItens = l.reduce((t,s) => t + s.itens.length, 0);
  const totalMs = l.reduce((t,s) => t + (s.duracaoMs||0), 0);
  return {
    nPv, nItens, totalMs,
    medioMs: nPv ? totalMs / nPv : null,
    porItemMs: nItens ? totalMs / nItens : null,
    itensHora: totalMs ? (nItens / (totalMs/3600000)) : null
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   SINCRONIZAÇÃO COM GOOGLE SHEETS
   Envia via POST text/plain (evita preflight CORS no Apps Script). Se a
   resposta não puder ser lida, tenta de novo em modo no-cors e mantém o
   registro na fila até uma confirmação.
   ══════════════════════════════════════════════════════════════════════════ */

function pendentes(){
  return S.historico.filter(s => s.status === 'finalizada' && s.sync !== 'ok');
}

function payload(sep){
  return {
    action: 'separacao',
    abaSeparacao: S.cfg.abaSeparacao,
    abaItens: S.cfg.abaItens,
    separacao: {
      ID: sep.id,
      PV: sep.pv,
      Operador: sep.operador || '',
      Data: fmtData(sep.inicio),
      Inicio: isoLocal(sep.inicio),
      Fim: isoLocal(sep.fim),
      Liberado_Producao: isoLocal(sep.liberadoEm || sep.fim),
      Duracao_seg: Math.round((sep.duracaoMs||0)/1000),
      Duracao: fmtDur(sep.duracaoMs),
      Qtd_Itens: sep.itens.length,
      Tempo_Medio_Item_seg: sep.itens.length ? Math.round((sep.duracaoMs||0)/1000/sep.itens.length) : '',
      Status: sep.status,
      Observacao: sep.obs || '',
      PV_Bruto: sep.pvBruto || ''
    },
    itens: sep.itens.map(i => ({
      ID_Separacao: sep.id,
      PV: sep.pv,
      Seq: i.seq,
      Rastreabilidade: i.rastreabilidade,
      Data_Hora: isoLocal(i.ts),
      Desde_Inicio_seg: Math.round(i.desdeInicioMs/1000),
      Desde_Item_Anterior_seg: Math.round(i.desdeAnteriorMs/1000),
      Operador: sep.operador || '',
      Codigo_Bruto: i.bruto || ''
    }))
  };
}

async function enviar(sep){
  const url = (S.cfg.appsScriptUrl||'').trim();
  if(!url) return false;
  const body = JSON.stringify(payload(sep));
  try{
    // text/plain evita o preflight OPTIONS, que o Apps Script não responde.
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      redirect: 'follow'
    });
    if(res.ok){
      const txt = await res.text();
      if(/"ok"\s*:\s*true/.test(txt) || /^OK/i.test(txt.trim())) return true;
      // Respondeu, mas sem confirmação reconhecível: considera entregue.
      return true;
    }
    return false;
  }catch(e){
    // CORS/rede: última tentativa às cegas, sem marcar como confirmado.
    try{
      await fetch(url, { method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
    }catch(e2){ /* offline */ }
    return false;
  }
}

let sincronizando = false;
async function sincronizar(manual){
  if(sincronizando) return;
  const fila = pendentes();
  if(!fila.length){
    if(manual) toast('Nada pendente para enviar', 'ok');
    statusSync();
    return;
  }
  if(!(S.cfg.appsScriptUrl||'').trim()){
    if(manual) toast('Configure a URL do Apps Script', 'err');
    statusSync();
    return;
  }
  if(!navigator.onLine){
    if(manual) toast('Sem conexão — os dados seguem salvos no aparelho', 'err');
    statusSync();
    return;
  }
  sincronizando = true;
  statusSync('enviando');
  let ok = 0;
  for(const sep of fila){
    const r = await enviar(sep);
    sep.sync = r ? 'ok' : 'pendente';
    if(r) ok++;
  }
  salvar();
  sincronizando = false;
  statusSync();
  if(manual || ok){
    toast(ok ? `${ok} separação(ões) enviada(s) ao Sheets` : 'Envio falhou — vamos tentar de novo',
          ok ? 'ok' : 'err');
  }
  if(S.tela === 'det') renderDet();
  if(S.tela === 'hist') renderHist();
}

function statusSync(estado){
  const el = $('sync-dot');
  if(!el) return;
  const n = pendentes().length;
  const semUrl = !(S.cfg.appsScriptUrl||'').trim();
  let cls = 'sync-dot', txt;
  if(estado === 'enviando'){ cls += ' pend'; txt = 'enviando'; }
  else if(semUrl){ cls += ' off'; txt = 'local'; }
  else if(!navigator.onLine){ cls += ' off'; txt = 'offline'; }
  else if(n){ cls += ' pend'; txt = n + ' pend'; }
  else { txt = 'sync'; }
  el.className = cls;
  el.lastElementChild.textContent = txt;
}

/* ══════════════════════════════════════════════════════════════════════════
   LEITOR — câmera (BarcodeDetector nativo, com jsQR de reserva)
   + leitor bluetooth "keyboard wedge" (digita o código e dá Enter)
   ══════════════════════════════════════════════════════════════════════════ */

const Scanner = {
  stream: null, track: null, detector: null, raf: null,
  ativo: false, alvo: null, ultimo: '', ultimoTs: 0, torchOn: false,

  async abrir(alvo, titulo, sub){
    this.alvo = alvo;
    $('scan-title').textContent = titulo;
    $('scan-sub').textContent = sub || '';
    $('scan-msg').textContent = 'Aponte a câmera para o código';
    $('scan').classList.add('on');
    this.ativo = true; this.ultimo = ''; this.torchOn = false;

    if(!this.detector && 'BarcodeDetector' in window){
      try{
        const fmts = await window.BarcodeDetector.getSupportedFormats();
        const quero = ['qr_code','code_128','code_39','ean_13','ean_8','itf','codabar',
                       'data_matrix','pdf417','upc_a','upc_e'].filter(f => fmts.includes(f));
        if(quero.length) this.detector = new window.BarcodeDetector({ formats: quero });
      }catch(e){ this.detector = null; }
    }

    try{
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} },
        audio: false
      });
    }catch(e){
      $('scan-msg').textContent = 'Câmera indisponível — use "Digitar"';
      toast('Sem acesso à câmera. Libere a permissão ou digite o código.', 'err');
      return;
    }
    const v = $('scan-video');
    v.srcObject = this.stream;
    try{ await v.play(); }catch(e){}
    this.track = this.stream.getVideoTracks()[0];
    const caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
    $('scan-torch').style.display = caps && caps.torch ? '' : 'none';
    this.loop();
  },

  loop(){
    if(!this.ativo) return;
    const v = $('scan-video');
    let ultimaAnalise = 0, quadro = 0;

    const passo = async () => {
      if(!this.ativo) return;
      const agora = performance.now();
      // ~12 análises/s: suficiente para a leitura parecer instantânea e
      // leve o bastante para não fritar a bateria do aparelho.
      if(v.readyState >= 2 && agora - ultimaAnalise >= 80){
        ultimaAnalise = agora;
        quadro++;
        let codigo = null;

        if(this.detector){
          try{
            const r = await this.detector.detect(v);
            if(r && r.length) codigo = r[0].rawValue;
          }catch(e){ this.detector = null; }
        }
        if(!codigo && window.jsQR) codigo = this.lerQR(v, quadro % 4 !== 0);

        if(codigo) this.achou(codigo);
      }
      this.raf = requestAnimationFrame(passo);
    };
    this.raf = requestAnimationFrame(passo);
  },

  /* Decodifica QR pelo jsQR — o caminho usado onde não há BarcodeDetector
     (Safari/iOS, por exemplo). Por padrão analisa só o quadrado central, que
     é o que a mira mostra ao operador: menos pixels, leitura mais rápida e
     sem disputa com códigos vizinhos na prateleira. A cada 4 análises varre
     o quadro inteiro, para não ignorar um código pouco fora da mira.        */
  lerQR(v, sohCentro){
    const vw = v.videoWidth, vh = v.videoHeight;
    if(!vw || !vh) return null;

    const lado = sohCentro ? Math.min(vw, vh) * 0.7 : 0;
    const sx = sohCentro ? (vw - lado) / 2 : 0;
    const sy = sohCentro ? (vh - lado) / 2 : 0;
    const sw = sohCentro ? lado : vw;
    const sh = sohCentro ? lado : vh;

    const MAX = 512;
    const escala = Math.min(1, MAX / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * escala));
    const h = Math.max(1, Math.round(sh * escala));

    const c = $('scan-canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
    if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);

    const img = ctx.getImageData(0, 0, w, h);
    const q = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    return q && q.data ? q.data : null;
  },

  achou(codigo){
    const agora = Date.now();
    // Antirrepetição: a câmera lê o mesmo código dezenas de vezes por segundo.
    if(codigo === this.ultimo && agora - this.ultimoTs < 2200) return;
    this.ultimo = codigo; this.ultimoTs = agora;

    const ret = $('reticle');
    ret.classList.add('hit'); setTimeout(()=>ret.classList.remove('hit'), 380);

    const ok = entregar(this.alvo, codigo);
    if(!ok){
      if(this.alvo === 'pv') this.fechar();   // o fluxo do PV não continua; libera a tela
      return;
    }

    if(this.alvo === 'item' && S.cfg.scanContinuo){
      $('scan-msg').textContent = `✓ ${extrair(codigo, S.cfg.regexItem)} — ${S.ativa ? S.ativa.itens.length : 0} item(ns). Leia o próximo.`;
      $('scan-sub').textContent = S.ativa ? `${rotuloPV(S.ativa.pv)} · ${S.ativa.itens.length} lido(s)` : '';
    } else {
      this.fechar();
    }
  },

  async torch(){
    if(!this.track) return;
    this.torchOn = !this.torchOn;
    try{
      await this.track.applyConstraints({ advanced: [{ torch: this.torchOn }] });
      $('scan-torch').classList.toggle('torch-on', this.torchOn);
    }catch(e){ toast('Lanterna indisponível neste aparelho', 'err'); }
  },

  fechar(){
    this.ativo = false;
    if(this.raf) cancelAnimationFrame(this.raf);
    if(this.track && this.torchOn){ try{ this.track.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
    if(this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null; this.track = null;
    $('scan-video').srcObject = null;
    $('scan-torch').classList.remove('torch-on');
    $('scan').classList.remove('on');
    render();
  }
};

/* Encaminha um código lido (câmera, leitor bluetooth ou digitação) */
function entregar(alvo, codigo){
  if(alvo === 'pv') return iniciarSeparacao(codigo);
  if(alvo === 'item') return addItem(codigo);
  return false;
}

/* ── LEITOR BLUETOOTH / USB (keyboard wedge) ───────────────────────────────
   Coletores emulam teclado: digitam rápido e terminam com Enter. Capturamos
   o burst, desde que o foco não esteja num campo de digitação normal.       */
let wedgeBuf = '', wedgeT = 0, wedgeTimer = null;
document.addEventListener('keydown', e => {
  const alvoFoco = document.activeElement;
  const digitando = alvoFoco && /^(INPUT|TEXTAREA|SELECT)$/.test(alvoFoco.tagName) && alvoFoco.id !== 'wedge';
  if(digitando) return;

  const agora = Date.now();
  if(agora - wedgeT > 120) wedgeBuf = '';   // pausa longa = nova leitura
  wedgeT = agora;

  if(e.key === 'Enter'){
    const cod = wedgeBuf.trim();
    wedgeBuf = '';
    if(cod.length >= 3){
      e.preventDefault();
      const alvo = Scanner.ativo ? Scanner.alvo : (S.ativa ? 'item' : 'pv');
      entregar(alvo, cod);
      if(!Scanner.ativo) render();
    }
    return;
  }
  if(e.key.length === 1){
    wedgeBuf += e.key;
    clearTimeout(wedgeTimer);
    wedgeTimer = setTimeout(() => { wedgeBuf = ''; }, 400);
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   EXPORTAÇÃO
   ══════════════════════════════════════════════════════════════════════════ */

function csvCampo(v){
  const s = String(v == null ? '' : v);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csv(linhas){
  return '﻿' + linhas.map(l => l.map(csvCampo).join(';')).join('\r\n');
}
function baixar(nome, conteudo, tipo){
  const blob = new Blob([conteudo], { type: (tipo||'text/csv') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
}

function exportarCSV(qual){
  const l = finalizadas();
  if(!l.length){ toast('Nada para exportar', 'err'); return; }
  const hoje = `${new Date().getFullYear()}${pad(new Date().getMonth()+1)}${pad(new Date().getDate())}`;
  if(qual === 'sep'){
    const linhas = [['ID','PV','Operador','Data','Inicio','Fim','Liberado_Producao',
                     'Duracao_seg','Duracao','Qtd_Itens','Tempo_Medio_Item_seg','Status','Observacao']];
    l.forEach(s => {
      const p = payload(s).separacao;
      linhas.push([p.ID,p.PV,p.Operador,p.Data,p.Inicio,p.Fim,p.Liberado_Producao,
                   p.Duracao_seg,p.Duracao,p.Qtd_Itens,p.Tempo_Medio_Item_seg,p.Status,p.Observacao]);
    });
    baixar(`separacoes_${hoje}.csv`, csv(linhas));
  } else {
    const linhas = [['ID_Separacao','PV','Seq','Rastreabilidade','Data_Hora',
                     'Desde_Inicio_seg','Desde_Item_Anterior_seg','Operador']];
    l.forEach(s => payload(s).itens.forEach(i =>
      linhas.push([i.ID_Separacao,i.PV,i.Seq,i.Rastreabilidade,i.Data_Hora,
                   i.Desde_Inicio_seg,i.Desde_Item_Anterior_seg,i.Operador])));
    baixar(`separacao_itens_${hoje}.csv`, csv(linhas));
  }
  toast('CSV gerado', 'ok');
}

function textoResumo(s){
  return [
    `SEPARAÇÃO — ${rotuloPV(s.pv)}`,
    `Operador: ${s.operador || '—'}`,
    `Início: ${fmtDataHora(s.inicio)}`,
    `Fim: ${fmtDataHora(s.fim)}`,
    `Duração: ${fmtDur(s.duracaoMs)}`,
    `Liberado para produção: ${fmtDataHora(s.liberadoEm || s.fim)}`,
    `Itens (${s.itens.length}):`,
    ...s.itens.map(i => `  ${i.seq}. ${i.rastreabilidade} — ${fmtHora(i.ts)}`),
    s.obs ? `Obs.: ${s.obs}` : ''
  ].filter(Boolean).join('\n');
}

const TELAS = { home:'sc-home', sep:'sc-sep', hist:'sc-hist', det:'sc-det', cfg:'sc-cfg' };
const TITULOS = {
  home: ['Expedição & Separação','Cacto Group'],
  sep:  ['Separação em andamento','Leia as etiquetas dos itens'],
  hist: ['Histórico','Separações registradas'],
  det:  ['Detalhe da separação','Rastreabilidade e tempos'],
  cfg:  ['Configurações','Operador, leitura e sincronia']
};

const EXP = {
  go(tela){
    S.tela = tela;
    Object.entries(TELAS).forEach(([k,id]) => $(id).classList.toggle('on', k === tela));
    document.querySelectorAll('.nav button').forEach(b =>
      b.classList.toggle('on', b.dataset.nav === tela));
    const [t, sub] = TITULOS[tela] || TITULOS.home;
    $('top-title').textContent = t;
    $('top-sub').textContent = sub;
    $('top-back').style.display = (tela === 'det' || tela === 'sep') ? '' : 'none';
    $(TELAS[tela]).scrollTop = 0;
    render();
  },
  back(){ EXP.go(S.tela === 'sep' ? 'home' : 'hist'); },
  det(id){ S.detId = id; EXP.go('det'); },
  filtro(f){ S.histFiltro = f; renderHist(); },

  lerPV(){ Scanner.abrir('pv', 'Ler QR do PV', 'Pedido de venda a separar'); },
  lerItem(){
    if(!S.ativa) return EXP.go('home');
    Scanner.abrir('item', 'Ler etiqueta do item',
      `${rotuloPV(S.ativa.pv)} · ${S.ativa.itens.length} lido(s)`);
  },
  digitarPV(){ pedirCodigo('pv'); },
  digitarItem(){ pedirCodigo('item'); },
  scanManual(){ const a = Scanner.alvo; Scanner.fechar(); pedirCodigo(a); },
  scanClose(){ Scanner.fechar(); },
  torch(){ Scanner.torch(); },

  manualOk(alvo){
    const i = $('man-input');
    const v = i ? i.value.trim() : '';
    if(!v){ toast('Digite o código', 'err'); return; }
    EXP.sheetClose();
    entregar(alvo, v);
    render();
  },
  sheetClose(){ $('sheet').classList.remove('on'); sheetOnOk = null; },
  sheetOk(){ const f = sheetOnOk; EXP.sheetClose(); if(f) f(); },

  removerItem(seq){ removerItem(seq); },
  obs(v){ if(S.ativa){ S.ativa.obs = v; salvar(); } },

  pedirFinalizar(){
    if(!S.ativa) return;
    const a = S.ativa, dur = fmtDur(Date.now() - a.inicio);
    if(!a.itens.length){
      confirmar({
        titulo: 'Finalizar sem itens?',
        texto: `Nenhuma etiqueta foi lida no <b>${esc(rotuloPV(a.pv))}</b>. O registro vai ficar sem rastreabilidade.`,
        ok: 'Finalizar mesmo assim', okCls: 'btn-green', onOk: finalizarSeparacao
      });
      return;
    }
    confirmar({
      titulo: 'Finalizar separação?',
      texto: `<b>${esc(rotuloPV(a.pv))}</b> · <b>${a.itens.length}</b> item(ns) · tempo <b>${dur}</b>.<br>` +
             `O PV será marcado como liberado para produção agora.`,
      ok: 'Finalizar', okCls: 'btn-green', onOk: finalizarSeparacao
    });
  },
  pedirCancelar(){
    if(!S.ativa) return;
    confirmar({
      titulo: 'Cancelar separação?',
      texto: `O <b>${esc(rotuloPV(S.ativa.pv))}</b> não será liberado para produção e ` +
             `as ${S.ativa.itens.length} leitura(s) ficam registradas apenas como cancelada.`,
      ok: 'Cancelar separação', okCls: 'btn-red', cancelar: 'Voltar', onOk: cancelarSeparacao
    });
  },

  cfg(k, v){ S.cfg[k] = v; salvar(); statusSync(); },
  toggle(k){ S.cfg[k] = !S.cfg[k]; salvar(); renderCfg(); },
  testar(){
    const out = $('cfg-teste-out'), amostra = $('cfg-teste');
    if(!out || !amostra) return;
    const v = amostra.value.trim();
    if(!v){
      out.innerHTML = 'Sem regex, o app usa o conteúdo lido direto (já tratando URLs e pares chave=valor).';
      return;
    }
    out.innerHTML = `PV → <b>${esc(extrair(v, S.cfg.regexPV))}</b><br>` +
                    `Item → <b>${esc(extrair(v, S.cfg.regexItem))}</b>`;
  },

  sincronizar(manual){ sincronizar(manual); },
  exportar(q){ exportarCSV(q); },
  backup(){
    baixar(`backup_expedicao_${Date.now()}.json`,
           JSON.stringify({ cfg:S.cfg, ativa:S.ativa, historico:S.historico }, null, 2),
           'application/json');
    toast('Backup gerado', 'ok');
  },
  async compartilhar(id){
    const s = acharSep(id); if(!s) return;
    const texto = textoResumo(s);
    if(navigator.share){
      try{ await navigator.share({ title: 'Separação ' + rotuloPV(s.pv), text: texto }); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    try{ await navigator.clipboard.writeText(texto); toast('Resumo copiado', 'ok'); }
    catch(e){ toast('Não foi possível compartilhar', 'err'); }
  },
  pedirLimpar(){
    confirmar({
      titulo: 'Limpar histórico?',
      texto: pendentes().length
        ? `<b>Atenção:</b> ${pendentes().length} separação(ões) ainda não foram enviadas ao Sheets e serão perdidas. Faça o backup antes.`
        : 'As separações já enviadas continuam no Google Sheets. Só o histórico do aparelho é apagado.',
      ok: 'Apagar', okCls: 'btn-red',
      onOk(){ S.historico = []; salvar(); toast('Histórico limpo'); EXP.go('cfg'); }
    });
  }
};
